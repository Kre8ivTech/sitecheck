name: sitecheck
services:
  edge:
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3100}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, outbound]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3100}
      SITECHECK_PROXY: http://egress:3128
      SITECHECK_DATA: /data
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    volumes:
      - reports:/data
    networks:
      - isolated
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 256m
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    depends_on:
      - egress
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  egress:
    build: .
    command: [node, dist/egress-main.js]
    init: true
    restart: unless-stopped
    networks:
      - isolated
      - outbound
    read_only: true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
networks:
  isolated:
    internal: true
  outbound:
volumes:
  reports:
